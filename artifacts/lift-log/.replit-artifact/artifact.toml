kind = "web"
previewPath = "/"
title = "Lofte"
description = "A focused Olympic weightlifting tracker for athlete PBs, weekly programmes, working weights, workouts, and training history."
version = "1.0.0"
id = "artifacts/lift-log"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21583

[services.development]
run = "pnpm --filter @workspace/lift-log run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lift-log", "run", "build" ]
serve = "static"
publicDir = "artifacts/lift-log/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21583"
BASE_PATH = "/"
