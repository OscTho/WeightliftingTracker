name: Production web smoke check

on:
  push:
  pull_request:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/lift-log exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/lift-log run test:production
        env:
          CI: 'true'