openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Olympic weightlifting workout tracking API
servers:
  - url: /api
    description: Base API path
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Athlete profile and personal bests
  - name: programmes
    description: Weekly training programmes
  - name: workouts
    description: Training sessions and set outcomes
  - name: history
    description: Completed training history
paths:
  /auth/signup:
    post:
      operationId: signup
      security: []
      tags: [auth]
      summary: Create an account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /auth/me:
    get:
      operationId: getCurrentSession
      security: []
      tags: [auth]
      summary: Get the current signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/ApiError" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204": { description: Session revoked }
  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change the current athlete's password and replace their session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "200":
          description: Password changed and replacement session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
  /auth/password-reset/config:
    get:
      operationId: getPasswordResetConfig
      security: []
      tags: [auth]
      summary: Check whether password reset email delivery is configured
      responses:
        "200":
          description: Password reset availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetConfig" }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      security: []
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequestInput" }
      responses:
        "202":
          description: Request accepted regardless of whether the email is registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetRequestResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      security: []
      tags: [auth]
      summary: Replace a password using a single-use reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmationInput" }
      responses:
        "204": { description: Password changed and existing sessions revoked }
        "400": { $ref: "#/components/responses/ApiError" }
  /account/export:
    get:
      operationId: exportAccountData
      tags: [auth]
      summary: Export all data owned by the current athlete
      responses:
        "200":
          description: Portable account data export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDataExport" }
        "401": { $ref: "#/components/responses/ApiError" }
  /account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the current athlete account and owned data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionInput" }
      responses:
        "204": { description: Account permanently deleted }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the athlete profile
      responses:
        "200":
          description: Athlete profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteProfile"
    put:
      operationId: saveProfile
      tags: [profile]
      summary: Create or update the athlete profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteProfileInput"
      responses:
        "200":
          description: Saved athlete profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteProfile"
  /programmes:
    get:
      operationId: getProgrammes
      tags: [programmes]
      summary: List weekly programmes
      responses:
        "200":
          description: Weekly programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgrammeSummary"
    post:
      operationId: createProgramme
      tags: [programmes]
      summary: Create a weekly programme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammeInput"
      responses:
        "201":
          description: Created programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
  /programmes/{programmeId}:
    parameters:
      - $ref: "#/components/parameters/ProgrammeId"
    get:
      operationId: getProgramme
      tags: [programmes]
      summary: Get a programme with all sessions and exercises
      responses:
        "200":
          description: Programme details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
    put:
      operationId: updateProgramme
      tags: [programmes]
      summary: Replace a weekly programme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammeInput"
      responses:
        "200":
          description: Updated programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
    delete:
      operationId: deleteProgramme
      tags: [programmes]
      summary: Delete a weekly programme
      responses:
        "204":
          description: Programme deleted
  /movements:
    get:
      operationId: getMovements
      tags: [programmes]
      summary: List standard and user-created movements
      responses:
        "200":
          description: Movement library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
    post:
      operationId: createMovement
      tags: [programmes]
      summary: Add a user-created movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "201":
          description: Created custom movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movement"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [history]
      summary: Get the next planned session and recent training summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /history:
    get:
      operationId: getHistory
      tags: [history]
      summary: List completed workout history
      responses:
        "200":
          description: Workout history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSummary"
  /workouts:
    post:
      operationId: startWorkout
      tags: [workouts]
      summary: Start a workout from a programme session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWorkoutInput"
      responses:
        "201":
          description: Started workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
  /workouts/{workoutId}:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: getWorkout
      tags: [workouts]
      summary: Get a workout and its set outcomes
      responses:
        "200":
          description: Workout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
  /workouts/{workoutId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
      - $ref: "#/components/parameters/SetId"
    patch:
      operationId: updateWorkoutSet
      tags: [workouts]
      summary: Save the load for a workout set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSetUpdate"
      responses:
        "200":
          description: Updated workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
  /workouts/{workoutId}/sets/{setId}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
      - $ref: "#/components/parameters/SetId"
    post:
      operationId: completeSet
      tags: [workouts]
      summary: Mark a set complete
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSetInput"
      responses:
        "200":
          description: Updated workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
  /workouts/{workoutId}/sets/{setId}/miss:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
      - $ref: "#/components/parameters/SetId"
    post:
      operationId: missSet
      tags: [workouts]
      summary: Mark a set missed and either retry it or move on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissSetInput"
      responses:
        "200":
          description: Updated workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
  /workouts/{workoutId}/finish:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    post:
      operationId: finishWorkout
      tags: [workouts]
      summary: Finish the current workout
      responses:
        "200":
          description: Finished workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lofte_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ApiError:
      description: Request error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  parameters:
    ProgrammeId:
      name: programmeId
      in: path
      required: true
      schema:
        type: integer
    WorkoutId:
      name: workoutId
      in: path
      required: true
      schema:
        type: integer
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SignupInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 20 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    PasswordResetConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetRequestResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PasswordResetConfirmationInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 8, maxLength: 128 }
    PasswordChangeInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }
    AuthUser:
      type: object
      required: [id, username, email]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
    AuthSession:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        token:
          type: string
          description: Opaque session token for native clients; web clients use the HttpOnly cookie.
    AccountDeletionInput:
      type: object
      required: [password, confirmation]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        confirmation:
          type: string
          enum: [DELETE]
    AccountDataExport:
      type: object
      required: [exportedAt, account, profile, programmes, workouts, customMovements]
      properties:
        exportedAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/ExportedAccount" }
        profile:
          anyOf:
            - { $ref: "#/components/schemas/AthleteProfile" }
            - { type: "null" }
        programmes:
          type: array
          items: { $ref: "#/components/schemas/Programme" }
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }
        customMovements:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
    ExportedAccount:
      type: object
      required: [username, email, createdAt]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AthleteProfile:
      type: object
      required: [id, name, snatchPb, cleanJerkPb, backSquatPb, frontSquatPb, roundingIncrement, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        snatchPb: { type: number }
        cleanJerkPb: { type: number }
        backSquatPb: { type: number }
        frontSquatPb: { type: number }
        roundingIncrement:
          type: number
          enum: [1, 2, 2.5]
        updatedAt: { type: string, nullable: true }
    AthleteProfileInput:
      type: object
      required: [name, snatchPb, cleanJerkPb, backSquatPb, frontSquatPb, roundingIncrement]
      properties:
        name: { type: string, minLength: 1 }
        snatchPb: { type: number, minimum: 0 }
        cleanJerkPb: { type: number, minimum: 0 }
        backSquatPb: { type: number, minimum: 0 }
        frontSquatPb: { type: number, minimum: 0 }
        roundingIncrement:
          type: number
          enum: [1, 2, 2.5]
    ExerciseName:
      type: string
      description: Legacy movement identifier retained for workout compatibility
    AccessoryEquipment:
      type: string
      enum: [kettlebell, bands, barbell, dumbbell]
    Movement:
      type: object
      required: [id, name, category, isCustom, userId]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: ["string", "null"] }
        isCustom: { type: boolean }
        userId: { type: ["string", "null"] }
    MovementInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 240 }
    ProgrammeExerciseInput:
      type: object
      required: [sets, reps]
      properties:
        movementId: { type: string, minLength: 1 }
        exercise: { $ref: "#/components/schemas/ExerciseName" }
        sets: { type: integer, minimum: 1, maximum: 30 }
        reps: { type: integer, minimum: 1, maximum: 20 }
        percentage: { type: number, minimum: 1, maximum: 150 }
        weight:
          type: number
          minimum: 0
          description: Direct working weight for an accessory movement
        equipment: { $ref: "#/components/schemas/AccessoryEquipment" }
    ProgrammeSessionInput:
      type: object
      required: [sessionNumber, name, exercises]
      properties:
        sessionNumber: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1 }
        exercises:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProgrammeExerciseInput" }
    ProgrammeInput:
      type: object
      required: [name, sessionsPerWeek, lengthWeeks, sessions]
      properties:
        name: { type: string, minLength: 1 }
        sessionsPerWeek: { type: integer, minimum: 1, maximum: 14 }
        lengthWeeks: { type: integer, minimum: 1, maximum: 52 }
        sessions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProgrammeSessionInput" }
    ProgrammeExercise:
      allOf:
        - $ref: "#/components/schemas/ProgrammeExerciseInput"
        - type: object
          required: [id, order, movementId]
          properties:
            id: { type: integer }
            order: { type: integer }
    ProgrammeSession:
      type: object
      required: [id, sessionNumber, name, exercises]
      properties:
        id: { type: integer }
        sessionNumber: { type: integer }
        name: { type: string }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/ProgrammeExercise" }
    Programme:
      type: object
      required: [id, name, sessionsPerWeek, lengthWeeks, sessions, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        sessionsPerWeek: { type: integer }
        lengthWeeks: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ProgrammeSession" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProgrammeSummary:
      type: object
      required: [id, name, sessionsPerWeek, lengthWeeks, sessionNames, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        sessionsPerWeek: { type: integer }
        lengthWeeks: { type: integer }
        sessionNames:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    StartWorkoutInput:
      type: object
      required: [programmeId, sessionNumber]
      properties:
        programmeId: { type: integer }
        sessionNumber: { type: integer, minimum: 1 }
    CompleteSetInput:
      type: object
      description: Optional actual load used for the set. When supplied, the next pending set of the same exercise uses this load.
      properties:
        weight: { type: number, minimum: 0 }
    WorkoutSetUpdate:
      type: object
      description: The load and optional accessory equipment to save for this set and carry into later pending sets of the same movement.
      required: [weight]
      properties:
        weight: { type: number, exclusiveMinimum: 0 }
        equipment: { $ref: "#/components/schemas/AccessoryEquipment" }
    WorkoutSet:
      type: object
      required: [id, exercise, setNumber, totalSets, reps, weight, status, attemptNumber]
      properties:
        movementId: { type: string }
        id: { type: integer }
        exercise: { $ref: "#/components/schemas/ExerciseName" }
        setNumber: { type: integer }
        totalSets: { type: integer }
        reps: { type: integer }
        percentage: { type: number }
        weight: { type: number }
        equipment: { $ref: "#/components/schemas/AccessoryEquipment" }
        status:
          type: string
          enum: [pending, completed, missed, skipped]
        attemptNumber: { type: integer }
        completedAt: { type: ["string", "null"], format: date-time }
    Workout:
      type: object
      required: [id, programmeId, programmeName, sessionNumber, sessionName, status, startedAt, completedSets, missedSets, attempts, sets]
      properties:
        id: { type: integer }
        programmeId: { type: integer }
        programmeName: { type: string }
        sessionNumber: { type: integer }
        sessionName: { type: string }
        status:
          type: string
          enum: [in_progress, completed]
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        completedSets: { type: integer }
        missedSets: { type: integer }
        attempts: { type: integer }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSet" }
    PbSet:
      type: object
      required: [exercise, weight]
      properties:
        exercise: { $ref: "#/components/schemas/ExerciseName" }
        weight: { type: number }
    WorkoutSummary:
      type: object
      required: [id, sessionName, programmeName, date, completedSets, totalSets, missedSets, attempts, hasPb, pbSets]
      properties:
        id: { type: integer }
        sessionName: { type: string }
        programmeName: { type: string }
        date: { type: string, format: date-time }
        completedSets: { type: integer }
        totalSets: { type: integer }
        missedSets: { type: integer }
        attempts: { type: integer }
        hasPb: { type: boolean }
        pbSets:
          type: array
          items: { $ref: "#/components/schemas/PbSet" }
    Dashboard:
      type: object
      required: [profile, programme, nextSession, recentWorkouts, weeklyCompletedSets]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/AthleteProfile"
            - type: "null"
        programme:
          anyOf:
            - $ref: "#/components/schemas/ProgrammeSummary"
            - type: "null"
        nextSession:
          anyOf:
            - $ref: "#/components/schemas/ProgrammeSession"
            - type: "null"
        recentWorkouts:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSummary" }
        weeklyCompletedSets: { type: integer }
    MissSetInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [retry, move_on]

